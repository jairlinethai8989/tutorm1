<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <defs>
    <style>
      .code-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .digit-box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 4; }
      .lbl-title { font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .rule-text { font-family: 'Sarabun', system-ui, sans-serif; font-size: 13.5px; fill: #334155; }
      .rule-num { font-family: 'Sarabun', system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .tri { fill: #ffffff; stroke: #1e293b; stroke-width: 2; stroke-linejoin: round; }
      .inner-tri { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-linejoin: round; }
      .val-text { font-family: 'Sarabun', system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .center-val { font-size: 16px; fill: #2563eb; }
    </style>
  </defs>

  <!-- Rules Header -->
  <g transform="translate(180, 25)">
    <text x="0" y="16" class="lbl-title">รหัส SK คือ</text>
    <rect x="85" y="0" width="28" height="26" class="digit-box" />
    <text x="99" y="14" class="rule-num">A</text>
    <rect x="117" y="0" width="28" height="26" class="digit-box" />
    <text x="131" y="14" class="rule-num">B</text>
    <rect x="149" y="0" width="28" height="26" class="digit-box" />
    <text x="163" y="14" class="rule-num">C</text>
  </g>

  <!-- Rules List -->
  <g transform="translate(50, 65)">
    <!-- 1 -->
    <text x="0" y="18" class="rule-text">1. รหัส</text>
    <rect x="42" y="4" width="20" height="20" class="digit-box" /><text x="52" y="15" class="rule-num">5</text>
    <rect x="64" y="4" width="20" height="20" class="digit-box" /><text x="74" y="15" class="rule-num">9</text>
    <rect x="86" y="4" width="20" height="20" class="digit-box" /><text x="96" y="15" class="rule-num">4</text>
    <text x="120" y="18" class="rule-text">มีตัวเลขหนึ่งตัวถูกต้องและอยู่ในตำแหน่งที่ถูกต้อง</text>

    <!-- 2 -->
    <text x="0" y="44" class="rule-text">2. รหัส</text>
    <rect x="42" y="30" width="20" height="20" class="digit-box" /><text x="52" y="41" class="rule-num">5</text>
    <rect x="64" y="30" width="20" height="20" class="digit-box" /><text x="74" y="41" class="rule-num">7</text>
    <rect x="86" y="30" width="20" height="20" class="digit-box" /><text x="96" y="41" class="rule-num">2</text>
    <text x="120" y="44" class="rule-text">มีตัวเลขหนึ่งตัวถูกต้องและอยู่ในตำแหน่งที่ไม่ถูกต้อง</text>

    <!-- 3 -->
    <text x="0" y="70" class="rule-text">3. รหัส</text>
    <rect x="42" y="56" width="20" height="20" class="digit-box" /><text x="52" y="67" class="rule-num">4</text>
    <rect x="64" y="56" width="20" height="20" class="digit-box" /><text x="74" y="67" class="rule-num">3</text>
    <rect x="86" y="56" width="20" height="20" class="digit-box" /><text x="96" y="67" class="rule-num">5</text>
    <text x="120" y="70" class="rule-text">มีตัวเลขสองตัวถูกต้องแต่อยู่ผิดตำแหน่งทั้งคู่</text>

    <!-- 4 -->
    <text x="0" y="96" class="rule-text">4. รหัส</text>
    <rect x="42" y="82" width="20" height="20" class="digit-box" /><text x="52" y="93" class="rule-num">1</text>
    <rect x="64" y="82" width="20" height="20" class="digit-box" /><text x="74" y="93" class="rule-num">0</text>
    <rect x="86" y="82" width="20" height="20" class="digit-box" /><text x="96" y="93" class="rule-num">9</text>
    <text x="120" y="96" class="rule-text">ตัวเลขทั้งหมดไม่ถูกต้อง</text>

    <!-- 5 -->
    <text x="0" y="122" class="rule-text">5. รหัส</text>
    <rect x="42" y="108" width="20" height="20" class="digit-box" /><text x="52" y="119" class="rule-num">9</text>
    <rect x="64" y="108" width="20" height="20" class="digit-box" /><text x="74" y="119" class="rule-num">1</text>
    <rect x="86" y="108" width="20" height="20" class="digit-box" /><text x="96" y="119" class="rule-num">3</text>
    <text x="120" y="122" class="rule-text">มีตัวเลขหนึ่งตัวถูกต้องแต่ผิดตำแหน่ง</text>
  </g>

  <!-- 4 Triangles Section -->
  <text x="50" y="222" class="rule-text" font-weight="bold">จากนั้น นำรหัส SK ที่ถูกต้องมาหาค่า X ที่เป็นคำตอบจากแบบรูปนี้</text>

  <!-- Triangle 1 -->
  <g transform="translate(80, 240)">
    <polygon points="45,0 90,80 0,80" class="tri" />
    <polygon points="45,35 68,75 22,75" class="inner-tri" />
    <text x="45" y="20" class="val-text">10</text>
    <text x="14" y="68" class="val-text">3</text>
    <text x="76" y="68" class="val-text">4</text>
    <text x="45" y="58" class="val-text center-val">6</text>
  </g>

  <!-- Triangle 2 -->
  <g transform="translate(210, 240)">
    <polygon points="45,0 90,80 0,80" class="tri" />
    <polygon points="45,35 68,75 22,75" class="inner-tri" />
    <text x="45" y="20" class="val-text">12</text>
    <text x="14" y="68" class="val-text">2</text>
    <text x="76" y="68" class="val-text">5</text>
    <text x="45" y="58" class="val-text center-val">10</text>
  </g>

  <!-- Triangle 3 -->
  <g transform="translate(340, 240)">
    <polygon points="45,0 90,80 0,80" class="tri" />
    <polygon points="45,35 68,75 22,75" class="inner-tri" />
    <text x="45" y="20" class="val-text">15</text>
    <text x="14" y="68" class="val-text">3</text>
    <text x="76" y="68" class="val-text">6</text>
    <text x="45" y="58" class="val-text center-val">12</text>
  </g>

  <!-- Triangle 4 -->
  <g transform="translate(470, 240)">
    <polygon points="45,0 90,80 0,80" class="tri" />
    <polygon points="45,35 68,75 22,75" class="inner-tri" />
    <text x="45" y="20" class="val-text">10A</text>
    <text x="14" y="68" class="val-text">5B</text>
    <text x="76" y="68" class="val-text">4C</text>
    <text x="45" y="58" class="val-text center-val" fill="#dc2626">X</text>
  </g>
</svg>
