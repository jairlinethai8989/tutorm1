<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" width="100%" height="100%">
  <defs>
    <style>
      .wire { stroke: #334155; stroke-width: 2.5; fill: none; }
      .bulb-circle { fill: #ffffff; stroke: #0f172a; stroke-width: 2; }
      .bulb-x { stroke: #0f172a; stroke-width: 2; }
      .lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .term { font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #dc2626; }
      .battery { stroke: #0f172a; stroke-width: 3; }
    </style>
  </defs>

  <!-- Main loop wires -->
  <!-- Left vertical wire with bulb A -->
  <line x1="140" y1="120" x2="140" y2="185" class="wire" />
  <line x1="140" y1="215" x2="140" y2="240" class="wire" />
  <line x1="140" y1="240" x2="215" y2="240" class="wire" />
  <!-- Battery -->
  <line x1="215" y1="230" x2="215" y2="250" class="battery" stroke-width="4" />
  <line x1="225" y1="235" x2="225" y2="245" class="battery" stroke-width="2" />
  <!-- Bottom right wire to R -->
  <line x1="225" y1="240" x2="310" y2="240" class="wire" />
  <line x1="310" y1="240" x2="310" y2="215" class="wire" />
  <!-- Right vertical wire with bulb D -->
  <line x1="310" y1="185" x2="310" y2="120" class="wire" />

  <!-- Bulb A at (140, 200) -->
  <circle cx="140" cy="200" r="14" class="bulb-circle" />
  <line x1="130" y1="190" x2="150" y2="210" class="bulb-x" />
  <line x1="130" y1="210" x2="150" y2="190" class="bulb-x" />
  <text x="115" y="205" class="lbl">A</text>

  <!-- Bulb D at (310, 200) -->
  <circle cx="310" cy="200" r="14" class="bulb-circle" />
  <line x1="300" y1="190" x2="320" y2="210" class="bulb-x" />
  <line x1="300" y1="210" x2="320" y2="190" class="bulb-x" />
  <text x="335" y="205" class="lbl">D</text>

  <!-- Terminal P at (140, 120), Terminal Q at (310, 120), Terminal R at (310, 240) -->
  <circle cx="140" cy="120" r="4" fill="#dc2626" />
  <text x="125" y="125" class="term">P</text>
  <circle cx="310" cy="120" r="4" fill="#dc2626" />
  <text x="325" y="125" class="term">Q</text>
  <circle cx="310" cy="240" r="4" fill="#dc2626" />
  <text x="325" y="245" class="term">R</text>

  <!-- Middle branch with bulb C -->
  <line x1="140" y1="120" x2="210" y2="120" class="wire" />
  <line x1="240" y1="120" x2="310" y2="120" class="wire" />
  <circle cx="225" cy="120" r="14" class="bulb-circle" />
  <line x1="215" y1="110" x2="235" y2="130" class="bulb-x" />
  <line x1="215" y1="130" x2="235" y2="110" class="bulb-x" />
  <text x="225" y="148" class="lbl">C</text>

  <!-- Top branch with bulb B -->
  <path d="M 140,120 L 170,80 L 210,80" class="wire" />
  <path d="M 240,80 L 280,80 L 310,120" class="wire" />
  <circle cx="225" cy="80" r="14" class="bulb-circle" />
  <line x1="215" y1="70" x2="235" y2="90" class="bulb-x" />
  <line x1="215" y1="90" x2="235" y2="70" class="bulb-x" />
  <text x="225" y="60" class="lbl">B</text>
</svg>
