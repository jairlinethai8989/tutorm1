<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <defs>
    <style>
      .node-box { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; rx: 8; }
      .x-box { fill: #f1f5f9; stroke: #0f172a; stroke-width: 2.5; rx: 8; }
      .lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .arr-line { stroke: #334155; stroke-width: 2; fill: none; }
      .num-circle { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; }
      .num-lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Nodes -->
  <!-- Top: X (325, 45) -->
  <rect x="265" y="25" width="120" height="42" class="x-box" />
  <text x="325" y="46" class="lbl" font-size="18px">X</text>

  <!-- Left: ตะกอน (190, 150) -->
  <rect x="130" y="130" width="120" height="42" class="node-box" />
  <text x="190" y="151" class="lbl">ตะกอน</text>

  <!-- Right: หินแปร (460, 150) -->
  <rect x="400" y="130" width="120" height="42" class="node-box" />
  <text x="460" y="151" class="lbl">หินแปร</text>

  <!-- Bottom-Left: หินอัคนี (230, 290) -->
  <rect x="170" y="270" width="120" height="42" class="node-box" />
  <text x="230" y="291" class="lbl">หินอัคนี</text>

  <!-- Bottom-Right: แมกมา หรือลาวา (420, 290) -->
  <rect x="350" y="270" width="140" height="42" class="node-box" />
  <text x="420" y="291" class="lbl">แมกมา หรือลาวา</text>

  <!-- Arrows -->
  <!-- 1: ตะกอน -> X -->
  <line x1="200" y1="130" x2="280" y2="67" class="arr-line" marker-end="url(#arr)" />
  <circle cx="235" cy="94" r="10" class="num-circle" /><text x="235" y="95" class="num-lbl">1</text>

  <!-- 2: X -> หินแปร -->
  <line x1="370" y1="67" x2="445" y2="130" class="arr-line" marker-end="url(#arr)" />
  <circle cx="412" cy="94" r="10" class="num-circle" /><text x="412" y="95" class="num-lbl">2</text>

  <!-- 3: หินแปร -> แมกมา -->
  <line x1="460" y1="172" x2="435" y2="270" class="arr-line" marker-end="url(#arr)" />
  <circle cx="452" cy="225" r="10" class="num-circle" /><text x="452" y="226" class="num-lbl">3</text>

  <!-- 4: แมกมา -> หินอัคนี -->
  <line x1="350" y1="291" x2="290" y2="291" class="arr-line" marker-end="url(#arr)" />
  <circle cx="320" cy="305" r="10" class="num-circle" /><text x="320" y="306" class="num-lbl">4</text>

  <!-- 5: หินอัคนี -> ตะกอน -->
  <line x1="210" y1="270" x2="195" y2="172" class="arr-line" marker-end="url(#arr)" />
  <circle cx="198" cy="225" r="10" class="num-circle" /><text x="198" y="226" class="num-lbl">5</text>

  <!-- 6: หินแปร -> ตะกอน -->
  <line x1="400" y1="151" x2="250" y2="151" class="arr-line" marker-end="url(#arr)" />
  <circle cx="325" cy="138" r="10" class="num-circle" /><text x="325" y="139" class="num-lbl">6</text>

  <!-- 7: หินอัคนี -> หินแปร -->
  <line x1="270" y1="270" x2="415" y2="172" class="arr-line" marker-end="url(#arr)" />
  <circle cx="330" cy="222" r="10" class="num-circle" /><text x="330" y="223" class="num-lbl">7</text>

  <!-- 8: หินอัคนี -> แมกมา -->
  <line x1="290" y1="280" x2="350" y2="280" class="arr-line" marker-end="url(#arr)" />
  <circle cx="320" cy="265" r="10" class="num-circle" /><text x="320" y="266" class="num-lbl">8</text>
</svg>
