<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="100%" height="100%">
  <defs>
    <style>
      .chart-title { font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 13px; fill: #334155; }
      .bar-lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .axis-lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 12px; fill: #64748b; text-anchor: end; }
      .grid-line { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 3,3; }
      .axis-line { stroke: #475569; stroke-width: 2; }
      .bar { fill: #334155; }
    </style>
  </defs>

  <!-- 1. Pie Chart Box -->
  <rect x="50" y="20" width="500" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="300" y="45" class="chart-title">ร้อยละของนักเรียนทั้งหมดที่ชอบแนวเพลงแต่ละประเภท</text>

  <!-- Pie Chart (cx=300, cy=140, r=75) -->
  <g transform="translate(300, 140)">
    <!-- Circle outline -->
    <circle cx="0" cy="0" r="75" fill="#f8fafc" stroke="#334155" stroke-width="2" />
    
    <!-- Jazz 10% (36 deg): from -90 to -54 deg -->
    <!-- Pop 25% (90 deg): from -54 to 36 deg -->
    <!-- Classical 30% (108 deg): from 36 to 144 deg -->
    <!-- Rock 35% (126 deg): from 144 to 270 (-90) deg -->
    <!-- Dividing lines from center -->
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="0" x2="44.08" y2="-60.68" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="0" x2="60.68" y2="44.08" stroke="#334155" stroke-width="2" />
    <line x1="0" y1="0" x2="-60.68" y2="44.08" stroke="#334155" stroke-width="2" />

    <!-- Labels -->
    <text x="22" y="-38" class="lbl" font-weight="bold" text-anchor="middle">แจ๊ส</text>
    <text x="50" y="-8" class="lbl" font-weight="bold" text-anchor="middle">ป๊อป<tspan x="50" dy="16" font-size="11px">25%</tspan></text>
    <text x="0" y="45" class="lbl" font-weight="bold" text-anchor="middle">คลาสสิก<tspan x="0" dy="16" font-size="11px">30%</tspan></text>
    <text x="-48" y="-10" class="lbl" font-weight="bold" text-anchor="middle">ร็อก<tspan x="-48" dy="16" font-size="11px">35%</tspan></text>
  </g>

  <!-- 2. Bar Chart Box -->
  <rect x="50" y="260" width="500" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="300" y="285" class="chart-title">จำนวนนักเรียนชายที่ชอบแนวเพลงแต่ละประเภท</text>

  <!-- Y axis label -->
  <text x="110" y="310" class="lbl" font-weight="bold">จำนวน(คน)</text>

  <!-- Grid lines & Y-axis labels -->
  <!-- origin at (150, 490), height = 180 for 200 people (0.9 px per person) -->
  <g id="grid">
    <!-- 200 -->
    <line x1="150" y1="310" x2="490" y2="310" class="grid-line" />
    <text x="140" y="314" class="axis-lbl">200</text>
    <!-- 180 -->
    <line x1="150" y1="328" x2="490" y2="328" class="grid-line" />
    <text x="140" y="332" class="axis-lbl">180</text>
    <!-- 160 -->
    <line x1="150" y1="346" x2="490" y2="346" class="grid-line" />
    <text x="140" y="350" class="axis-lbl">160</text>
    <!-- 140 -->
    <line x1="150" y1="364" x2="490" y2="364" class="grid-line" />
    <text x="140" y="368" class="axis-lbl">140</text>
    <!-- 120 -->
    <line x1="150" y1="382" x2="490" y2="382" class="grid-line" />
    <text x="140" y="386" class="axis-lbl">120</text>
    <!-- 100 -->
    <line x1="150" y1="400" x2="490" y2="400" class="grid-line" />
    <text x="140" y="404" class="axis-lbl">100</text>
    <!-- 80 -->
    <line x1="150" y1="418" x2="490" y2="418" class="grid-line" />
    <text x="140" y="422" class="axis-lbl">80</text>
    <!-- 60 -->
    <line x1="150" y1="436" x2="490" y2="436" class="grid-line" />
    <text x="140" y="440" class="axis-lbl">60</text>
    <!-- 40 -->
    <line x1="150" y1="454" x2="490" y2="454" class="grid-line" />
    <text x="140" y="458" class="axis-lbl">40</text>
    <!-- 20 -->
    <line x1="150" y1="472" x2="490" y2="472" class="grid-line" />
    <text x="140" y="476" class="axis-lbl">20</text>
    <!-- 0 -->
    <text x="140" y="494" class="axis-lbl">0</text>
  </g>

  <!-- Axes -->
  <line x1="150" y1="305" x2="150" y2="490" class="axis-line" />
  <line x1="150" y1="490" x2="500" y2="490" class="axis-line" />
  <!-- Arrow on X axis -->
  <polygon points="500,486 508,490 500,494" fill="#475569" />
  <text x="515" y="494" class="lbl" font-weight="bold">แนวเพลง</text>

  <!-- Bars (0.9 px per person, y = 490 - count*0.9) -->
  <!-- Jazz: 50 -> h=45, y=445 -->
  <rect x="185" y="445" width="28" height="45" class="bar" />
  <text x="199" y="512" class="bar-lbl">แจ๊ส</text>

  <!-- Pop: 90 -> h=81, y=409 -->
  <rect x="265" y="409" width="28" height="81" class="bar" />
  <text x="279" y="512" class="bar-lbl">ป๊อป</text>

  <!-- Rock: 170 -> h=153, y=337 -->
  <rect x="345" y="337" width="28" height="153" class="bar" />
  <text x="359" y="512" class="bar-lbl">ร็อก</text>

  <!-- Classical: 80 -> h=72, y=418 -->
  <rect x="425" y="418" width="28" height="72" class="bar" />
  <text x="439" y="512" class="bar-lbl">คลาสสิก</text>
</svg>
