<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 180" width="100%" height="100%">
  <defs>
    <style>
      .circle-bg { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .circle-line { stroke: #334155; stroke-width: 2; }
      .num-text { font-family: 'Sarabun', system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .bold-num { font-size: 22px; fill: #0f172a; }
    </style>
  </defs>

  <!-- Circle 1 -->
  <g transform="translate(75, 90)">
    <circle cx="0" cy="0" r="60" class="circle-bg" />
    <line x1="-60" y1="0" x2="60" y2="0" class="circle-line" />
    <line x1="0" y1="0" x2="0" y2="60" class="circle-line" />
    <text x="0" y="-30" class="num-text bold-num">42</text>
    <text x="-30" y="30" class="num-text">6</text>
    <text x="30" y="30" class="num-text">15</text>
  </g>

  <!-- Circle 2 -->
  <g transform="translate(225, 90)">
    <circle cx="0" cy="0" r="60" class="circle-bg" />
    <line x1="-60" y1="0" x2="60" y2="0" class="circle-line" />
    <line x1="0" y1="0" x2="0" y2="60" class="circle-line" />
    <text x="0" y="-30" class="num-text bold-num">40</text>
    <text x="-30" y="30" class="num-text">8</text>
    <text x="30" y="30" class="num-text">11</text>
  </g>

  <!-- Circle 3 -->
  <g transform="translate(375, 90)">
    <circle cx="0" cy="0" r="60" class="circle-bg" />
    <line x1="-60" y1="0" x2="60" y2="0" class="circle-line" />
    <line x1="0" y1="0" x2="0" y2="60" class="circle-line" />
    <text x="0" y="-30" class="num-text bold-num">20</text>
    <text x="-30" y="30" class="num-text">2</text>
    <text x="30" y="30" class="num-text">3b</text>
  </g>

  <!-- Circle 4 -->
  <g transform="translate(525, 90)">
    <circle cx="0" cy="0" r="60" class="circle-bg" />
    <line x1="-60" y1="0" x2="60" y2="0" class="circle-line" />
    <line x1="0" y1="0" x2="0" y2="60" class="circle-line" />
    <text x="0" y="-30" class="num-text bold-num">a</text>
    <text x="-30" y="30" class="num-text">4</text>
    <text x="30" y="30" class="num-text">9</text>
  </g>

  <!-- Circle 5 -->
  <g transform="translate(675, 90)">
    <circle cx="0" cy="0" r="60" class="circle-bg" />
    <line x1="-60" y1="0" x2="60" y2="0" class="circle-line" />
    <line x1="0" y1="0" x2="0" y2="60" class="circle-line" />
    <text x="0" y="-30" class="num-text bold-num" fill="#2563eb">x</text>
    <text x="-30" y="30" class="num-text">a</text>
    <text x="30" y="30" class="num-text">5b</text>
  </g>
</svg>
