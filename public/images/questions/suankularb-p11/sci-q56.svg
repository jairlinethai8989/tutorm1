<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <defs>
    <style>
      .device { fill: #f8fafc; stroke: #0f172a; stroke-width: 2; }
      .ray { stroke: #0284c7; stroke-width: 2; fill: none; }
      .lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    </style>
    <marker id="ray-head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Device (A): Diverging (Concave lens / Convex mirror) -->
  <g transform="translate(40, 20)">
    <rect x="90" y="20" width="16" height="110" class="device" />
    <!-- Incoming parallel rays -->
    <line x1="20" y1="45" x2="90" y2="45" class="ray" marker-mid="url(#ray-head)" />
    <polygon points="50,42 58,45 50,48" fill="#0284c7" />
    <line x1="20" y1="105" x2="90" y2="105" class="ray" marker-mid="url(#ray-head)" />
    <polygon points="50,102 58,105 50,108" fill="#0284c7" />
    <!-- Diverging outgoing rays -->
    <line x1="106" y1="45" x2="180" y2="20" class="ray" />
    <polygon points="140,30 148,27 144,35" fill="#0284c7" />
    <line x1="106" y1="105" x2="180" y2="130" class="ray" />
    <polygon points="140,120 148,123 144,115" fill="#0284c7" />
    <text x="98" y="155" class="lbl">(A)</text>
  </g>

  <!-- Device (B): Straight through (Plane glass / flat plate) -->
  <g transform="translate(260, 20)">
    <rect x="90" y="20" width="16" height="110" class="device" />
    <!-- Incoming parallel rays -->
    <line x1="20" y1="45" x2="90" y2="45" class="ray" />
    <polygon points="50,42 58,45 50,48" fill="#0284c7" />
    <line x1="20" y1="105" x2="90" y2="105" class="ray" />
    <polygon points="50,102 58,105 50,108" fill="#0284c7" />
    <!-- Straight outgoing rays -->
    <line x1="106" y1="45" x2="180" y2="45" class="ray" />
    <polygon points="140,42 148,45 140,48" fill="#0284c7" />
    <line x1="106" y1="105" x2="180" y2="105" class="ray" />
    <polygon points="140,102 148,105 140,108" fill="#0284c7" />
    <text x="98" y="155" class="lbl">(B)</text>
  </g>

  <!-- Device (C): Converging (Convex lens) -->
  <g transform="translate(480, 20)">
    <rect x="90" y="20" width="16" height="110" class="device" />
    <!-- Incoming parallel rays -->
    <line x1="20" y1="45" x2="90" y2="45" class="ray" />
    <polygon points="50,42 58,45 50,48" fill="#0284c7" />
    <line x1="20" y1="105" x2="90" y2="105" class="ray" />
    <polygon points="50,102 58,105 50,108" fill="#0284c7" />
    <!-- Converging outgoing rays crossing over -->
    <line x1="106" y1="45" x2="190" y2="115" class="ray" />
    <polygon points="140,73 148,80 142,83" fill="#0284c7" />
    <line x1="106" y1="105" x2="190" y2="35" class="ray" />
    <polygon points="140,77 148,70 142,67" fill="#0284c7" />
    <text x="98" y="155" class="lbl">(C)</text>
  </g>
</svg>
