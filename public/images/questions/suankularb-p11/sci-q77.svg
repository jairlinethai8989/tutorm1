<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <style>
      .body-outline { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .organ-stomach { fill: #fca5a5; stroke: #b91c1c; stroke-width: 2; }
      .organ-liver { fill: #fed7aa; stroke: #c2410c; stroke-width: 2; }
      .organ-large-int { fill: #bbf7d0; stroke: #15803d; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .organ-small-int { fill: #fef08a; stroke: #ca8a04; stroke-width: 2; }
      .esophagus { stroke: #e11d48; stroke-width: 4; fill: none; }
      .lbl-box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.5; rx: 4; }
      .lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .pointer { stroke: #1e293b; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Human upper body silhouette outline -->
  <!-- Head & Torso -->
  <path d="M 240,40 C 265,40 280,60 275,85 C 270,105 255,115 250,120 L 255,145 C 275,150 310,165 320,200 L 320,400 L 180,400 L 180,200 C 190,165 225,150 245,145 L 250,120 C 245,115 230,105 225,85 C 220,60 235,40 240,40 Z" class="body-outline" />

  <!-- Digestive Tract -->
  <!-- Mouth / Salivary (A) -->
  <circle cx="258" cy="88" r="6" fill="#fb7185" stroke="#e11d48" stroke-width="1.5" />

  <!-- Esophagus (B) -->
  <path d="M 256,92 L 252,140 L 252,220" class="esophagus" />

  <!-- Liver (C) on anatomical right (viewer's left) -->
  <path d="M 215,225 C 215,215 245,215 250,225 C 255,245 220,265 210,250 Z" class="organ-liver" />

  <!-- Stomach (D) on anatomical left (viewer's right) -->
  <path d="M 252,220 C 265,215 285,225 280,250 C 275,270 250,265 242,250 Z" class="organ-stomach" />

  <!-- Large Intestine (F) frame around small intestine -->
  <!-- Ascending, Transverse, Descending colon -->
  <path d="M 215,340 L 215,280 C 215,275 225,275 245,275 L 265,275 C 280,275 285,280 285,340 L 285,355 L 250,370" class="organ-large-int" stroke-width="12" />

  <!-- Small Intestine (E/G) inside -->
  <path d="M 245,260 Q 235,290 260,295 Q 240,320 265,330 Q 235,340 250,355" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Labels and Pointers -->
  <!-- Label A: Mouth (Left) -->
  <line x1="160" y1="88" x2="252" y2="88" class="pointer" />
  <rect x="130" y="73" width="30" height="30" class="lbl-box" />
  <text x="145" y="88" class="lbl">A</text>

  <!-- Label B: Esophagus (Left) -->
  <line x1="190" y1="160" x2="252" y2="160" class="pointer" />
  <rect x="160" y="145" width="30" height="30" class="lbl-box" />
  <text x="175" y="160" class="lbl">B</text>

  <!-- Label C: Liver (Left) -->
  <line x1="165" y1="235" x2="215" y2="235" class="pointer" />
  <rect x="135" y="220" width="30" height="30" class="lbl-box" />
  <text x="150" y="235" class="lbl">C</text>

  <!-- Label D: Stomach (Right) -->
  <line x1="280" y1="240" x2="350" y2="240" class="pointer" />
  <rect x="350" y="225" width="30" height="30" class="lbl-box" />
  <text x="365" y="240" class="lbl">D</text>

  <!-- Label E: Small intestine / pancreas (Left) -->
  <line x1="165" y1="300" x2="235" y2="300" class="pointer" />
  <rect x="135" y="285" width="30" height="30" class="lbl-box" />
  <text x="150" y="300" class="lbl">E</text>

  <!-- Label F: Large intestine (Right) -->
  <line x1="285" y1="320" x2="350" y2="320" class="pointer" />
  <rect x="350" y="305" width="30" height="30" class="lbl-box" />
  <text x="365" y="320" class="lbl">F</text>

  <!-- Label G: Anus / Rectum (Right) -->
  <line x1="250" y1="375" x2="350" y2="375" class="pointer" />
  <rect x="350" y="360" width="30" height="30" class="lbl-box" />
  <text x="365" y="375" class="lbl">G</text>
</svg>
