<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 180" width="100%" height="100%">
  <defs>
    <style>
      .mirror { stroke: #0f172a; stroke-width: 3; }
      .hatch { stroke: #64748b; stroke-width: 1.5; }
      .ray { stroke: #0284c7; stroke-width: 2.5; fill: none; }
      .lbl { font-family: 'Sarabun', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
      .arc { stroke: #64748b; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="ray-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Horizontal mirror at y=120 -->
  <line x1="120" y1="120" x2="340" y2="120" class="mirror" />
  <!-- Hatch marks under mirror -->
  <path d="M 130,120 L 120,132 M 150,120 L 140,132 M 170,120 L 160,132 M 190,120 L 180,132 M 210,120 L 200,132 M 230,120 L 220,132 M 250,120 L 240,132 M 270,120 L 260,132 M 290,120 L 280,132 M 310,120 L 300,132 M 330,120 L 320,132" class="hatch" />

  <!-- Incident light ray -->
  <!-- Target point on mirror: (250, 120) -->
  <!-- Angle 20 deg with mirror: dx = -140, dy = -140 * tan(20°) ≈ -51 -> from (110, 69) to (250, 120) -->
  <line x1="120" y1="73" x2="250" y2="120" class="ray" marker-mid="url(#ray-arr)" />
  <polygon points="180,94 190,98 182,102" fill="#0284c7" />
  <text x="110" y="60" class="lbl">แสง</text>

  <!-- Arc for 20 deg -->
  <path d="M 205,120 A 45 45 0 0 0 216,108" class="arc" />
  <text x="180" y="112" class="lbl" font-size="13px">20°</text>
</svg>
