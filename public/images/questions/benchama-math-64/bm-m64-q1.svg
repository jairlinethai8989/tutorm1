<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
  </defs>

  <rect width="520" height="280" fill="#FFFFFF"/>

  <!-- Top branch X -->
  <rect x="180" y="30" width="45" height="35" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
  <text x="202" y="54" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">X</text>

  <!-- Arrow down from X with +12 -->
  <line x1="202" y1="65" x2="202" y2="100" stroke="#1E293B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="215" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563EB">+12</text>

  <!-- Box under X -->
  <rect x="180" y="100" width="45" height="35" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>

  <!-- Arrow down with -7 -->
  <line x1="202" y1="135" x2="202" y2="175" stroke="#1E293B" stroke-width="2"/>
  <text x="215" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#DC2626">-7</text>

  <!-- Arrow turns right into junction box -->
  <line x1="202" y1="175" x2="235" y2="175" stroke="#1E293B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Top branch Y -->
  <rect x="250" y="30" width="45" height="35" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
  <text x="272" y="54" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#1E293B" text-anchor="middle">Y</text>

  <!-- Arrow down from Y with +8 -->
  <line x1="272" y1="65" x2="272" y2="155" stroke="#1E293B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="285" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563EB">+8</text>

  <!-- Junction Box -->
  <rect x="245" y="155" width="55" height="40" rx="4" fill="#F1F5F9" stroke="#1E293B" stroke-width="2"/>

  <!-- Arrow right with ÷5 -->
  <line x1="300" y1="175" x2="345" y2="175" stroke="#1E293B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="322" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">÷5</text>

  <!-- Next box -->
  <rect x="345" y="155" width="45" height="40" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>

  <!-- Arrow right with ×8 -->
  <line x1="390" y1="175" x2="435" y2="175" stroke="#1E293B" stroke-width="2" marker-end="url(#arr)"/>
  <text x="412" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">×8</text>

  <!-- Result box 32 -->
  <rect x="435" y="155" width="45" height="40" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="457" y="181" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">32</text>
</svg>
