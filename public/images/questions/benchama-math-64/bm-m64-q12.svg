<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" width="100%" height="100%">
  <rect width="460" height="320" fill="#FFFFFF"/>

  <!-- Trapezoid ABCD -->
  <!-- AD is vertical, DC is horizontal -->
  <polygon points="60,60 230,80 390,260 60,260" fill="none" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Diagonal AC -->
  <line x1="60" y1="60" x2="390" y2="260" stroke="#1E293B" stroke-width="2.2"/>

  <!-- Line EF -->
  <line x1="180" y1="74" x2="245" y2="260" stroke="#1E293B" stroke-width="2.2"/>

  <!-- Right angle at D (60, 260) -->
  <rect x="60" y="244" width="16" height="16" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Angle at A (50°) between AD and AC -->
  <path d="M 60 95 A 35 35 0 0 0 85 76" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="66" y="94" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">50°</text>

  <!-- Intersection O (approx 206, 148) -->
  <!-- Angle q at O between OA and OE -->
  <path d="M 183 134 A 25 25 0 0 1 199 127" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="188" y="145" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">q</text>

  <!-- Angle r at E (180, 74) between EB and EF -->
  <path d="M 205 77 A 25 25 0 0 1 189 98" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="200" y="96" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">r</text>

  <!-- Angle p at F (245, 260) between FE and FC -->
  <path d="M 238 238 A 25 25 0 0 1 270 260" fill="none" stroke="#1E293B" stroke-width="1.8"/>
  <text x="250" y="252" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#1E293B">p</text>

  <!-- Vertex Labels -->
  <text x="45" y="60" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">A</text>
  <text x="235" y="78" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">B</text>
  <text x="400" y="265" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">C</text>
  <text x="42" y="265" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">D</text>
  <text x="175" y="55" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">E</text>
  <text x="240" y="280" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">F</text>
  <text x="215" y="152" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">O</text>
</svg>
