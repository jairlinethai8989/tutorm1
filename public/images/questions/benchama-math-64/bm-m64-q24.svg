<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="100%" height="100%">
  <rect width="360" height="340" fill="#FFFFFF"/>

  <!-- Square ABCD -->
  <rect x="60" y="40" width="240" height="240" fill="none" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Diagonal AC -->
  <line x1="60" y1="40" x2="300" y2="280" stroke="#1E293B" stroke-width="2.2"/>

  <!-- Segment BM (from B(60,280) to center M(180,160)) -->
  <line x1="60" y1="280" x2="180" y2="160" stroke="#1E293B" stroke-width="2.2"/>

  <!-- Perpendicular ME (from M(180,160) to E(180,280)) -->
  <line x1="180" y1="160" x2="180" y2="280" stroke="#1E293B" stroke-width="2.2"/>

  <!-- Segment EF (from E(180,280) to F(240,220) on AC) -->
  <line x1="180" y1="280" x2="240" y2="220" stroke="#1E293B" stroke-width="2.2"/>

  <!-- Right angle marker at M (perpendicular to AC) -->
  <path d="M 169 171 L 157 159 L 168 148" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Right angle marker at E (180, 280) -->
  <rect x="166" y="266" width="14" height="14" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Right angle marker at F (240, 220) on AC -->
  <path d="M 230 210 L 220 220 L 230 230" fill="none" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Labels -->
  <text x="45" y="38" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">A</text>
  <text x="310" y="38" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">D</text>
  <text x="42" y="295" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">B</text>
  <text x="310" y="295" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">C</text>
  <text x="176" y="302" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">E</text>
  <text x="250" y="222" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B">F</text>
</svg>
