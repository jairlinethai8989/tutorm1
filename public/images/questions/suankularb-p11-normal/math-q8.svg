<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="par-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="500" height="320" fill="#FFFFFF"/>

  <!-- Base Line A - D - C - F -->
  <line x1="50" y1="240" x2="450" y2="240" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Triangle ABC: A(60,240), B(170,90), C(320,240) -->
  <polygon points="60,240 170,90 320,240" fill="none" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Triangle DEF: D(190,240), E(310,120), F(430,240) -->
  <polygon points="190,240 310,120 430,240" fill="none" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Intersection G of BC and DE -->
  <!-- Line BC: (170,90) to (320,240). Slope = 150/150 = 1. Eq: y - 90 = x - 170 => y = x - 80 -->
  <!-- Line DE: (190,240) to (310,120). Slope = -120/120 = -1. Eq: y - 240 = -(x - 190) => y = 430 - x -->
  <!-- Intersection: x - 80 = 430 - x => 2x = 510 => x = 255, y = 175 -->
  <circle cx="255" cy="175" r="4" fill="#E11D48"/>

  <!-- Parallel markers on AB and DE -->
  <!-- Midpoint AB: (115, 165). Angle of AB: (90-240)/(170-60) = -150/110 -->
  <path d="M 110 172 L 118 161" stroke="#2563EB" stroke-width="3"/>
  <path d="M 115 176 L 123 165" stroke="#2563EB" stroke-width="3"/>

  <!-- Midpoint DE: (250, 180) -> on DE at (240, 190) -->
  <path d="M 235 197 L 243 186" stroke="#2563EB" stroke-width="3"/>
  <path d="M 240 201 L 248 190" stroke="#2563EB" stroke-width="3"/>

  <!-- Parallel markers on BC and EF -->
  <!-- Midpoint BC: (245, 165) -->
  <path d="M 215 142 L 225 146" stroke="#059669" stroke-width="3"/>
  <!-- Midpoint EF: (370, 180) -->
  <path d="M 375 174 L 385 178" stroke="#059669" stroke-width="3"/>

  <!-- Labels -->
  <text x="45" y="245" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">A</text>
  <text x="165" y="75" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">B</text>
  <text x="325" y="260" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">C</text>
  <text x="180" y="260" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">D</text>
  <text x="310" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">E</text>
  <text x="440" y="245" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">F</text>
  <text x="265" y="170" font-family="sans-serif" font-size="18" font-weight="bold" fill="#E11D48">G</text>
</svg>
