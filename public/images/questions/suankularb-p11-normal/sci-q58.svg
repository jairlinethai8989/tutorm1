<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 240" width="100%" height="100%">
  <rect width="650" height="240" fill="#FFFFFF"/>

  <!-- Circuit ก -->
  <g transform="translate(30, 20)">
    <!-- Wire loop -->
    <path d="M 40 40 L 90 40 M 110 40 L 160 40 L 160 160 L 110 160 M 90 160 L 40 160 L 40 110 M 40 70 L 40 40" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Bulb at top -->
    <circle cx="100" cy="40" r="12" fill="#FEF08A" stroke="#1E293B" stroke-width="2"/>
    <path d="M 94 46 L 106 34 M 94 34 L 106 46" stroke="#CA8A04" stroke-width="2"/>
    <!-- Material AB (left wire) -->
    <circle cx="40" cy="70" r="3.5" fill="#1E293B"/>
    <text x="20" y="75" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">B</text>
    <line x1="40" y1="70" x2="40" y2="110" stroke="#2563EB" stroke-width="4"/>
    <circle cx="40" cy="110" r="3.5" fill="#1E293B"/>
    <text x="20" y="115" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">A</text>
    <!-- Battery (1 cell) at bottom -->
    <line x1="95" y1="148" x2="95" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="105" y1="154" x2="105" y2="166" stroke="#1E293B" stroke-width="4"/>
    <!-- Label -->
    <text x="100" y="195" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">ก.</text>
  </g>

  <!-- Circuit ข -->
  <g transform="translate(235, 20)">
    <!-- Wire loop -->
    <path d="M 40 40 L 90 40 M 110 40 L 160 40 L 160 160 L 115 160 M 85 160 L 40 160 L 40 110 M 40 70 L 40 40" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Bulb at top -->
    <circle cx="100" cy="40" r="12" fill="#FEF08A" stroke="#1E293B" stroke-width="2"/>
    <path d="M 94 46 L 106 34 M 94 34 L 106 46" stroke="#CA8A04" stroke-width="2"/>
    <!-- Material XY (left wire) -->
    <circle cx="40" cy="70" r="3.5" fill="#1E293B"/>
    <text x="20" y="75" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Y</text>
    <line x1="40" y1="70" x2="40" y2="110" stroke="#DC2626" stroke-width="4"/>
    <circle cx="40" cy="110" r="3.5" fill="#1E293B"/>
    <text x="20" y="115" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">X</text>
    <!-- Battery (2 cells) at bottom -->
    <line x1="90" y1="148" x2="90" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="98" y1="154" x2="98" y2="166" stroke="#1E293B" stroke-width="4"/>
    <line x1="104" y1="148" x2="104" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="112" y1="154" x2="112" y2="166" stroke="#1E293B" stroke-width="4"/>
    <!-- Label -->
    <text x="100" y="195" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">ข.</text>
  </g>

  <!-- Circuit ค -->
  <g transform="translate(440, 20)">
    <!-- Wire loop -->
    <path d="M 40 40 L 90 40 M 110 40 L 160 40 L 160 160 L 125 160 M 75 160 L 40 160 L 40 110 M 40 70 L 40 40" fill="none" stroke="#1E293B" stroke-width="2"/>
    <!-- Bulb at top -->
    <circle cx="100" cy="40" r="12" fill="#FEF08A" stroke="#1E293B" stroke-width="2"/>
    <path d="M 94 46 L 106 34 M 94 34 L 106 46" stroke="#CA8A04" stroke-width="2"/>
    <!-- Material AB (left wire) -->
    <circle cx="40" cy="70" r="3.5" fill="#1E293B"/>
    <text x="20" y="75" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">B</text>
    <line x1="40" y1="70" x2="40" y2="110" stroke="#2563EB" stroke-width="4"/>
    <circle cx="40" cy="110" r="3.5" fill="#1E293B"/>
    <text x="20" y="115" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">A</text>
    <!-- Battery (4 cells) at bottom -->
    <line x1="80" y1="148" x2="80" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="86" y1="154" x2="86" y2="166" stroke="#1E293B" stroke-width="4"/>
    <line x1="92" y1="148" x2="92" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="98" y1="154" x2="98" y2="166" stroke="#1E293B" stroke-width="4"/>
    <line x1="104" y1="148" x2="104" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="110" y1="154" x2="110" y2="166" stroke="#1E293B" stroke-width="4"/>
    <line x1="116" y1="148" x2="116" y2="172" stroke="#1E293B" stroke-width="3"/>
    <line x1="122" y1="154" x2="122" y2="166" stroke="#1E293B" stroke-width="4"/>
    <!-- Label -->
    <text x="100" y="195" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">ค.</text>
  </g>
</svg>
