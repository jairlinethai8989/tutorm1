<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="100%" height="100%">
  <rect width="700" height="520" fill="#F8FAFC" rx="16"/>

  <!-- Header -->
  <rect x="180" y="20" width="340" height="60" rx="30" fill="#EA580C"/>
  <text x="210" y="62" font-family="'Sarabun', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF">6</text>
  <text x="250" y="60" font-family="'Sarabun', sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">วิธีลดเค็ม</text>

  <!-- ThaiHealth Tag -->
  <rect x="580" y="25" width="80" height="30" rx="6" fill="#10B981"/>
  <text x="600" y="46" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">สสส.</text>

  <!-- Card 1 -->
  <rect x="35" y="100" width="195" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="65" cy="130" r="18" fill="#F97316"/>
  <text x="59" y="137" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
  <text x="135" y="135" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">ทานอาหารสด</text>
  <text x="132" y="165" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">ไม่ผ่านการปรุงแต่ง</text>
  <text x="132" y="188" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">ปรุงอาหารเอง</text>
  <text x="132" y="211" font-family="'Sarabun', sans-serif" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">ชิมก่อนปรุง ไม่ปรุงเพิ่ม</text>

  <!-- Card 2 -->
  <rect x="252" y="100" width="195" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="282" cy="130" r="18" fill="#F97316"/>
  <text x="276" y="137" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">2</text>
  <text x="350" y="135" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">เลี่ยงน้ำจิ้ม</text>
  <text x="350" y="170" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">เลี่ยงทานอาหารคู่กับน้ำจิ้ม</text>
  <text x="350" y="195" font-family="'Sarabun', sans-serif" font-size="13" fill="#DC2626" font-weight="bold" text-anchor="middle">หรือเติมน้ำปลาพริก</text>

  <!-- Card 3 -->
  <rect x="470" y="100" width="195" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="500" cy="130" r="18" fill="#F97316"/>
  <text x="494" y="137" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="568" y="135" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">เลี่ยงรสจัด</text>
  <text x="568" y="170" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">เลี่ยงอาหารรสจัด</text>
  <text x="568" y="195" font-family="'Sarabun', sans-serif" font-size="13" fill="#DC2626" font-weight="bold" text-anchor="middle">มักมีผงชูรส น้ำปลา</text>
  <text x="568" y="218" font-family="'Sarabun', sans-serif" font-size="13" fill="#DC2626" font-weight="bold" text-anchor="middle">และน้ำปลาร้า</text>

  <!-- Card 4 -->
  <rect x="35" y="295" width="195" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="65" cy="325" r="18" fill="#F97316"/>
  <text x="59" y="332" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">4</text>
  <text x="135" y="330" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">เลี่ยงแปรรูป</text>
  <text x="132" y="365" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">เลี่ยงอาหารหมักดอง</text>
  <text x="132" y="390" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">อาหารแปรรูป อาหารกระป๋อง</text>
  <text x="132" y="415" font-family="'Sarabun', sans-serif" font-size="13" fill="#DC2626" font-weight="bold" text-anchor="middle">และขนมขบเคี้ยว</text>

  <!-- Card 5 -->
  <rect x="252" y="295" width="195" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="282" cy="325" r="18" fill="#F97316"/>
  <text x="276" y="332" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">5</text>
  <text x="350" y="330" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">อ่านฉลาก</text>
  <text x="350" y="365" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">อ่านฉลากโภชนาการ</text>
  <rect x="290" y="380" width="120" height="40" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
  <text x="350" y="398" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">โซเดียม 300 มก.</text>
  <text x="350" y="414" font-family="'Sarabun', sans-serif" font-size="11" fill="#B45309" text-anchor="middle">*13%</text>

  <!-- Card 6 -->
  <rect x="470" y="295" width="195" height="175" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="500" cy="325" r="18" fill="#F97316"/>
  <text x="494" y="332" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">6</text>
  <text x="568" y="330" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold" fill="#0F172A" text-anchor="middle">ใช้สมุนไพร</text>
  <text x="568" y="365" font-family="'Sarabun', sans-serif" font-size="13" fill="#475569" text-anchor="middle">ใช้สมุนไพรและเครื่องเทศ</text>
  <text x="568" y="390" font-family="'Sarabun', sans-serif" font-size="13" fill="#059669" font-weight="bold" text-anchor="middle">เพื่อแต่งกลิ่นและรส</text>
  <text x="568" y="415" font-family="'Sarabun', sans-serif" font-size="13" fill="#059669" text-anchor="middle">ทดแทนความเค็ม</text>

  <!-- Footer -->
  <text x="350" y="500" font-family="'Sarabun', sans-serif" font-size="13" fill="#64748B" text-anchor="middle">ที่มา: สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ (สสส.) https://www.thaihealth.or.th</text>
</svg>
