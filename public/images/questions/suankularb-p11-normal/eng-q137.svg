<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" height="100%">
  <!-- Card background -->
  <rect width="720" height="380" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>

  <!-- Title -->
  <text x="360" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1.5">ONE POMODORO CYCLE</text>

  <!-- Legend -->
  <rect x="290" y="65" width="60" height="25" rx="4" fill="#0F172A"/>
  <text x="320" y="82" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">study</text>

  <rect x="370" y="65" width="60" height="25" rx="4" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
  <text x="400" y="82" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">break</text>

  <!-- Main Grid Box (x=50, y=105, w=620, h=150) -->
  <rect x="50" y="105" width="620" height="150" fill="none" stroke="#0F172A" stroke-width="2"/>

  <!-- Pomodoro 1 (Study: 25 min, Break: 5 min) -->
  <!-- Tomato 1 icon -->
  <circle cx="95" cy="140" r="18" fill="#EF4444"/>
  <path d="M 95 122 L 95 116 M 92 118 L 98 118" stroke="#15803D" stroke-width="2.5"/>
  <rect x="50" y="170" width="90" height="45" fill="#0F172A"/>
  <text x="95" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25</text>
  <text x="95" y="205" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">min</text>

  <!-- Short Break 1 (5 min) -->
  <line x1="140" y1="105" x2="140" y2="215" stroke="#0F172A" stroke-width="2"/>
  <text x="162" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">5</text>
  <text x="162" y="205" font-family="sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">min</text>
  <line x1="185" y1="105" x2="185" y2="215" stroke="#0F172A" stroke-width="2"/>

  <!-- Pomodoro 2 (Study: 25 min, Break: 5 min) -->
  <!-- Tomato 2 icon -->
  <circle cx="230" cy="140" r="18" fill="#EF4444"/>
  <path d="M 230 122 L 230 116 M 227 118 L 233 118" stroke="#15803D" stroke-width="2.5"/>
  <rect x="185" y="170" width="90" height="45" fill="#0F172A"/>
  <text x="230" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25</text>
  <text x="230" y="205" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">min</text>

  <!-- Short Break 2 (5 min) -->
  <line x1="275" y1="105" x2="275" y2="215" stroke="#0F172A" stroke-width="2"/>
  <text x="297" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">5</text>
  <text x="297" y="205" font-family="sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">min</text>
  <line x1="320" y1="105" x2="320" y2="215" stroke="#0F172A" stroke-width="2"/>

  <!-- Pomodoro 3 (Study: 25 min, Break: 5 min) -->
  <!-- Tomato 3 icon -->
  <circle cx="365" cy="140" r="18" fill="#EF4444"/>
  <path d="M 365 122 L 365 116 M 362 118 L 368 118" stroke="#15803D" stroke-width="2.5"/>
  <rect x="320" y="170" width="90" height="45" fill="#0F172A"/>
  <text x="365" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25</text>
  <text x="365" y="205" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">min</text>

  <!-- Short Break 3 (5 min) -->
  <line x1="410" y1="105" x2="410" y2="215" stroke="#0F172A" stroke-width="2"/>
  <text x="432" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">5</text>
  <text x="432" y="205" font-family="sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">min</text>
  <line x1="455" y1="105" x2="455" y2="215" stroke="#0F172A" stroke-width="2"/>

  <!-- Pomodoro 4 (Study: 25 min) -->
  <!-- Tomato 4 icon -->
  <circle cx="500" cy="140" r="18" fill="#EF4444"/>
  <path d="M 500 122 L 500 116 M 497 118 L 503 118" stroke="#15803D" stroke-width="2.5"/>
  <rect x="455" y="170" width="90" height="45" fill="#0F172A"/>
  <text x="500" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25</text>
  <text x="500" y="205" font-family="sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">min</text>
  <line x1="545" y1="105" x2="545" y2="215" stroke="#0F172A" stroke-width="2"/>

  <!-- Long Break (15-30 min) -->
  <line x1="607" y1="170" x2="607" y2="215" stroke="#0F172A" stroke-width="2"/>
  <text x="576" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">15</text>
  <text x="576" y="205" font-family="sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">min</text>
  <text x="638" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">15</text>
  <text x="638" y="205" font-family="sans-serif" font-size="12" fill="#0F172A" text-anchor="middle">min</text>

  <!-- Bottom labels -->
  <line x1="50" y1="215" x2="670" y2="215" stroke="#0F172A" stroke-width="2"/>
  <text x="187" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">ONE POMODORO</text>
  <line x1="545" y1="215" x2="545" y2="255" stroke="#0F172A" stroke-width="2"/>
  <text x="607" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0F172A" text-anchor="middle">15-30 minute break</text>

  <!-- Explanatory text -->
  <text x="70" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">• The Pomodoro Technique is a time management method that involves studying in focused 25-minute</text>
  <text x="80" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#334155">intervals, called pomodoros, separated by short breaks.</text>
</svg>
