<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <rect width="520" height="280" fill="#FFFFFF"/>

  <!-- Ruler on the left: 0 to 15 cm -->
  <!-- Top rim at y=40 (0 cm), bottom at y=220 (15 cm). Height = 180px => 12px per cm -->
  <!-- 0 cm -> y=40
       3 cm -> y=76
       6 cm -> y=112
       9 cm -> y=148
       12 cm -> y=184
       15 cm -> y=220
  -->
  <line x1="85" y1="40" x2="85" y2="220" stroke="#1E293B" stroke-width="2"/>
  <line x1="75" y1="40" x2="85" y2="40" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="44" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">0</text>

  <line x1="75" y1="76" x2="85" y2="76" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="80" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">3</text>

  <line x1="75" y1="112" x2="85" y2="112" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="116" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">6</text>

  <line x1="75" y1="148" x2="85" y2="148" stroke="#1E293B" stroke-width="1.5"/>
  <text x="60" y="152" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">9</text>

  <line x1="75" y1="184" x2="85" y2="184" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="188" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">12</text>

  <line x1="75" y1="220" x2="85" y2="220" stroke="#1E293B" stroke-width="1.5"/>
  <text x="52" y="224" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">15</text>
  <text x="68" y="245" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" fill="#64748B">cm</text>

  <!-- Glasses A, B, C, D -->
  <!-- Glass A -->
  <g transform="translate(130, 0)">
    <rect x="0" y="40" width="55" height="180" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
    <!-- Liquid from y=184 to 220 (height 36px) -->
    <rect x="2" y="184" width="51" height="35" rx="2" fill="#38BDF8" opacity="0.8"/>
    <text x="27" y="250" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">A</text>
  </g>

  <!-- Glass B -->
  <g transform="translate(220, 0)">
    <rect x="0" y="40" width="55" height="180" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
    <!-- Liquid from y=148 to 220 (height 72px) -->
    <rect x="2" y="148" width="51" height="71" rx="2" fill="#38BDF8" opacity="0.8"/>
    <text x="27" y="250" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">B</text>
  </g>

  <!-- Glass C -->
  <g transform="translate(310, 0)">
    <rect x="0" y="40" width="55" height="180" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
    <!-- Liquid from y=112 to 220 (height 108px) -->
    <rect x="2" y="112" width="51" height="107" rx="2" fill="#38BDF8" opacity="0.8"/>
    <text x="27" y="250" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">C</text>
  </g>

  <!-- Glass D -->
  <g transform="translate(400, 0)">
    <rect x="0" y="40" width="55" height="180" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2"/>
    <!-- Liquid from y=76 to 220 (height 144px) -->
    <rect x="2" y="76" width="51" height="143" rx="2" fill="#38BDF8" opacity="0.8"/>
    <text x="27" y="250" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">D</text>
  </g>
</svg>
