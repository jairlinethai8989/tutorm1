<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <!-- Pattern/mask or clipped petals -->
    <clipPath id="circle-clip">
      <circle cx="225" cy="225" r="150"/>
    </clipPath>
  </defs>

  <rect width="450" height="450" fill="#FFFFFF"/>

  <!-- Outer Circle (Radius 10m = 150px) -->
  <circle cx="225" cy="225" r="150" fill="#F8FAFC" stroke="#1E293B" stroke-width="3"/>

  <!-- Semicircles forming the 4 petals inside clipped circle -->
  <!-- 4 semicircles of radius 75px (diameter 150px = R):
       Centers at (225, 150), (300, 225), (225, 300), (150, 225) -->
  <g clip-path="url(#circle-clip)">
    <!-- Shaded petals: intersection of adjacent semicircles -->
    <!-- Let's draw the 4 circular arcs forming the 4 leaves -->
    <!-- Top-Right petal -->
    <path d="M 225 75 A 75 75 0 0 1 225 225 A 75 75 0 0 1 375 225 A 75 75 0 0 0 225 75" fill="#1E293B"/>
    <!-- Bottom-Right petal -->
    <path d="M 375 225 A 75 75 0 0 1 225 225 A 75 75 0 0 1 225 375 A 75 75 0 0 0 375 225" fill="#1E293B"/>
    <!-- Bottom-Left petal -->
    <path d="M 225 375 A 75 75 0 0 1 225 225 A 75 75 0 0 1 75 225 A 75 75 0 0 0 225 375" fill="#1E293B"/>
    <!-- Top-Left petal -->
    <path d="M 75 225 A 75 75 0 0 1 225 225 A 75 75 0 0 1 225 75 A 75 75 0 0 0 75 225" fill="#1E293B"/>

    <!-- Outline of the 4 circles/semicircles -->
    <circle cx="225" cy="150" r="75" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="300" cy="225" r="75" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="225" cy="300" r="75" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="150" cy="225" r="75" fill="none" stroke="#1E293B" stroke-width="2"/>
  </g>

  <!-- Dimension indicators -->
  <!-- Radius 10m dashed lines -->
  <line x1="225" y1="225" x2="375" y2="225" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="375" y1="120" x2="375" y2="225" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="390" y1="120" x2="390" y2="225" stroke="#1E293B" stroke-width="1.5"/>
  <text x="395" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">10 m</text>

  <!-- Bottom dimension 10m -->
  <line x1="225" y1="225" x2="225" y2="375" stroke="#64748B" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="225" y1="375" x2="225" y2="395" stroke="#64748B" stroke-width="1.5"/>
  <line x1="300" y1="375" x2="300" y2="395" stroke="#64748B" stroke-width="1.5"/>
  <line x1="225" y1="390" x2="300" y2="390" stroke="#1E293B" stroke-width="1.5"/>
  <text x="245" y="415" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">10 m</text>
</svg>
