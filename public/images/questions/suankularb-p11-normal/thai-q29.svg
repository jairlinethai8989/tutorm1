<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 560" width="100%" height="100%">
  <rect width="650" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="325" y="45" font-family="'Sarabun', sans-serif" font-size="26" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="2">DREAMLAND'S MAP</text>

  <!-- Legend Box -->
  <rect x="30" y="65" width="590" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <text x="50" y="90" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">● อาคารสวนกุหลาบ/ตึกยาว (ตึก 1)</text>
  <text x="340" y="90" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">● อาคารศาลาพระเสด็จ (ตึก 4)</text>

  <text x="50" y="115" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">● อาคารสามัคยาจารย์ (ตึก 2)</text>
  <text x="340" y="115" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">● อาคารดำรงราชานุภาพ (ตึก 5)</text>

  <text x="50" y="140" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">● อาคารปิยมหาราชานุสรณ์ (ตึก 3)</text>
  <text x="340" y="140" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#1E293B">● อาคารสวนกุหลาบรำลึก (ตึก 6)</text>

  <!-- Center-bottom legend -->
  <rect x="220" y="165" width="220" height="26" rx="13" fill="#1E293B"/>
  <text x="330" y="183" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">อาคาร 123 ปี สวนกุหลาบฯ (ตึก 7)</text>

  <!-- Map Background (Campus field) -->
  <polygon points="120,320 380,200 560,330 380,510" fill="#334155" opacity="0.95"/>

  <!-- Compass Rose at bottom left -->
  <g transform="translate(90, 480)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#0F172A"/>
    <!-- North Arrow pointing down-left (-135 degrees) -->
    <path d="M 0 0 L -25 25 L -20 10 Z" fill="#DC2626"/>
    <path d="M 0 0 L -25 25 L -10 20 Z" fill="#991B1B"/>
    <!-- Opposite South -->
    <path d="M 0 0 L 25 -25 L 20 -10 Z" fill="#64748B"/>
    <path d="M 0 0 L 25 -25 L 10 -20 Z" fill="#94A3B8"/>
    <!-- Other points -->
    <path d="M 0 0 L -25 -25 L -10 -20 Z" fill="#94A3B8"/>
    <path d="M 0 0 L 25 25 L 10 20 Z" fill="#94A3B8"/>
    <!-- Letter N -->
    <text x="-40" y="38" font-family="sans-serif" font-size="18" font-weight="900" fill="#DC2626">N</text>
  </g>

  <!-- Building 1: Long building (อาคารสวนกุหลาบ/ตึกยาว) -->
  <circle cx="270" cy="430" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="270" y="436" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">1</text>

  <!-- Building 2: อาคารสามัคยาจารย์ -->
  <circle cx="260" cy="305" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="260" y="311" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">2</text>

  <!-- Building 3: อาคารปิยมหาราชานุสรณ์ -->
  <circle cx="360" cy="275" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="360" y="281" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">3</text>

  <!-- Building 4: อาคารศาลาพระเสด็จ -->
  <circle cx="420" cy="295" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="420" y="301" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">4</text>

  <!-- Building 5: อาคารดำรงราชานุภาพ -->
  <circle cx="465" cy="340" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="465" y="346" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">5</text>

  <!-- Building 6: อาคารสวนกุหลาบรำลึก -->
  <circle cx="440" cy="410" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="440" y="416" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">6</text>

  <!-- Building 7: อาคาร 123 ปี สวนกุหลาบฯ -->
  <circle cx="380" cy="385" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <text x="380" y="391" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0F172A" text-anchor="middle">7</text>
</svg>
