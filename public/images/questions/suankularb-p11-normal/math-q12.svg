<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 340" width="100%" height="100%">
  <defs>
    <marker id="par" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
  </defs>

  <rect width="550" height="340" fill="#FFFFFF"/>

  <!-- Parallel Line AB (top) -->
  <!-- A: (150, 60), B: (420, 60) -->
  <line x1="150" y1="60" x2="420" y2="60" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Parallel arrow on AB -->
  <polygon points="280,56 292,60 280,64" fill="#1E293B"/>

  <!-- Parallel Line CD (bottom) -->
  <!-- C: (90, 230), D: (250, 230) -->
  <line x1="90" y1="230" x2="250" y2="230" stroke="#1E293B" stroke-width="2.5"/>
  <!-- Parallel arrow on CD -->
  <polygon points="170,226 182,230 170,234" fill="#1E293B"/>

  <!-- Points:
       A: (150, 60)
       B: (420, 60)
       C: (90, 230)
       D: (220, 230)
       E: (330, 230)
  -->

  <!-- Segments -->
  <!-- AD -->
  <line x1="150" y1="60" x2="220" y2="230" stroke="#1E293B" stroke-width="2.5"/>
  <!-- AE -->
  <line x1="150" y1="60" x2="330" y2="230" stroke="#1E293B" stroke-width="2.5"/>
  <!-- BE -->
  <line x1="420" y1="60" x2="330" y2="230" stroke="#1E293B" stroke-width="2.5"/>
  <!-- DE is along the line CD extended: D(220,230) to E(330,230) -->
  <line x1="220" y1="230" x2="330" y2="230" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Equal angle arcs at A -->
  <!-- Angle DAE and EAB -->
  <path d="M 166 98 A 45 45 0 0 1 180 88" fill="none" stroke="#2563EB" stroke-width="2"/>
  <path d="M 175 118 A 65 65 0 0 1 198 100" fill="none" stroke="#2563EB" stroke-width="2"/>
  <!-- tick marks on angle bisector -->
  <line x1="170" y1="91" x2="176" y2="95" stroke="#2563EB" stroke-width="2"/>
  <line x1="184" y1="107" x2="190" y2="111" stroke="#2563EB" stroke-width="2"/>

  <!-- Angle at B: 2a -->
  <path d="M 385 60 A 35 35 0 0 1 398 102" fill="none" stroke="#E11D48" stroke-width="2"/>
  <text x="370" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#E11D48">2a</text>

  <!-- Right angle at E between AE and BE -->
  <!-- AE vector: (330-150, 230-60) = (180, 170). Normal: roughly 45 deg -->
  <!-- BE vector: (330-420, 230-60) = (-90, 170). Perpendicular! -->
  <path d="M 314 215 L 324 202 L 339 214" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Angle a at E with CD horizontal -->
  <path d="M 305 230 A 25 25 0 0 1 315 216" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="290" y="222" font-family="sans-serif" font-size="16" font-weight="bold" fill="#059669">a</text>

  <!-- Vertex Dots and Labels -->
  <circle cx="150" cy="60" r="3.5" fill="#1E293B"/>
  <text x="135" y="55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">A</text>

  <circle cx="420" cy="60" r="3.5" fill="#1E293B"/>
  <text x="430" y="55" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">B</text>

  <circle cx="90" cy="230" r="3.5" fill="#1E293B"/>
  <text x="70" y="235" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">C</text>

  <circle cx="220" cy="230" r="3.5" fill="#1E293B"/>
  <text x="210" y="255" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">D</text>

  <circle cx="330" cy="230" r="3.5" fill="#1E293B"/>
  <text x="335" y="255" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1E293B">E</text>
</svg>
