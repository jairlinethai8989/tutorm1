<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <rect width="500" height="450" fill="#FFFFFF"/>

  <!-- Center (Observer): cx=250, cy=250 -->

  <!-- Celestial dome (Hemisphere) -->
  <path d="M 100 250 A 150 150 0 0 1 400 250" fill="none" stroke="#64748B" stroke-width="2"/>
  
  <!-- Horizon ellipse -->
  <ellipse cx="250" cy="250" rx="150" ry="55" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Vertical Zenith line -->
  <line x1="250" y1="100" x2="250" y2="250" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="250" cy="100" r="3" fill="#1E293B"/>
  <text x="255" y="95" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">Zenith</text>

  <!-- Observer silhouette at center -->
  <circle cx="250" cy="242" r="5" fill="#0F172A"/>
  <line x1="250" y1="247" x2="250" y2="258" stroke="#0F172A" stroke-width="2"/>
  <line x1="244" y1="251" x2="256" y2="251" stroke="#0F172A" stroke-width="2"/>

  <!-- Direction N (North) on horizon -->
  <text x="180" y="240" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#2563EB">N</text>

  <!-- Star A on meridian (South, Azimuth 180) -->
  <!-- Zenith angle 12 deg => Altitude 78 deg -->
  <!-- Arc to Star A: angle 12 deg to the right of Zenith -->
  <!-- At radius 150: dx = 150*sin(12°) ≈ 31px, dy = 150*cos(12°) ≈ 147px -->
  <line x1="250" y1="250" x2="280" y2="105" stroke="#E11D48" stroke-width="2"/>
  <circle cx="280" cy="105" r="5" fill="#E11D48"/>
  <text x="288" y="105" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#E11D48">A</text>
  <!-- 12° arc -->
  <path d="M 250 140 A 40 40 0 0 1 258 141" fill="none" stroke="#E11D48" stroke-width="1.5"/>
  <text x="260" y="135" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" fill="#E11D48">12°</text>

  <!-- Star B -->
  <!-- Zenith angle 17 deg => Altitude 73 deg, Azimuth 245 deg (towards SW) -->
  <line x1="250" y1="250" x2="225" y2="115" stroke="#2563EB" stroke-width="2"/>
  <circle cx="225" cy="115" r="5" fill="#2563EB"/>
  <text x="210" y="115" font-family="'Sarabun', sans-serif" font-size="16" font-weight="bold" fill="#2563EB">B</text>
  <!-- 17° arc -->
  <path d="M 250 145 A 45 45 0 0 0 242 147" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <text x="228" y="145" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" fill="#2563EB">17°</text>

  <!-- Ground azimuth angle 25° / 65° arc -->
  <path d="M 245 275 A 30 15 0 0 1 260 275" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="245" y="295" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" fill="#059669">25°</text>
</svg>
