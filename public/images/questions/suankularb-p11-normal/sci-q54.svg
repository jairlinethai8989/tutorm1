<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <defs>
    <marker id="arr-left" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 1.5 L 2 5 L 10 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arr-right" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
  </defs>

  <rect width="450" height="200" fill="#FFFFFF"/>

  <!-- Horizontal floor -->
  <line x1="40" y1="150" x2="410" y2="150" stroke="#1E293B" stroke-width="2"/>
  <!-- Floor hatch lines -->
  <path d="M 50 150 L 40 162 M 70 150 L 60 162 M 90 150 L 80 162 M 110 150 L 100 162 M 130 150 L 120 162 M 150 150 L 140 162 M 170 150 L 160 162 M 190 150 L 180 162 M 210 150 L 200 162 M 230 150 L 220 162 M 250 150 L 240 162 M 270 150 L 260 162 M 290 150 L 280 162 M 310 150 L 300 162 M 330 150 L 320 162 M 350 150 L 340 162 M 370 150 L 360 162 M 390 150 L 380 162" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Block -->
  <rect x="210" y="80" width="90" height="70" fill="#334155" stroke="#0F172A" stroke-width="2"/>

  <!-- Force F3 pulling left -->
  <line x1="210" y1="100" x2="120" y2="100" stroke="#1E293B" stroke-width="3" marker-end="url(#arr-left)"/>
  <text x="155" y="85" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#1E293B">F&#8407;&#8323;</text>

  <!-- Force F1 pulling right (top) -->
  <line x1="300" y1="95" x2="380" y2="95" stroke="#1E293B" stroke-width="3" marker-end="url(#arr-right)"/>
  <text x="330" y="85" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#1E293B">F&#8407;&#8321;</text>

  <!-- Force F2 pulling right (bottom) -->
  <line x1="300" y1="125" x2="380" y2="125" stroke="#1E293B" stroke-width="3" marker-end="url(#arr-right)"/>
  <text x="330" y="145" font-family="'Sarabun', sans-serif" font-size="18" font-weight="bold" fill="#1E293B">F&#8407;&#8322;</text>
</svg>
